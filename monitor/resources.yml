# BioComp resource monitor — the BioComputing UP resources that are checked. Hand-maintained.
#   url                 the website checked for uptime
#   group               dashboard grouping
#   repo                the GitHub repository (owner/name) whose code activity is tracked
#   check.url           overrides url for the uptime check
#   check.verify_tls    false skips TLS verification (use sparingly)
#   api.url             a backend endpoint, checked as a separate target "<id>--api"
#   api.expect          what the JSON must contain for the API to count as up (monitor/README.md):
#                         field: dotted path into the JSON that must exist (list items by index: 0.name)
#                         equals: the value at field, compared as text
#                         min: the number at field (or its length, for a list/object/text) is at least this
#                         min_items: the whole JSON body is a list or object of at least this many items
#   notify              GitHub usernames also emailed when this resource (website or API) is down
#
# The DOME resources are tracked by BioComputingUP/dome-tracking; the dashboard shows them too,
# read from that repo's data branch, so they are not repeated here.

# Outage issues (scripts/notify.py): opened after this many failed runs in a row, closed when
# the resource is back up. The people here are @mentioned and assigned on every outage issue, so
# they are emailed about all resources. Ivan Micetic is the BioComp admin. To email someone about
# one resource only, add `notify: [username]` to that resource instead.
notify:
  people: [ivanmicetic]
  min_consecutive_down: 2

resources:
# --- Databases ---------------------------------------------------------------
- id: disprot
  name: DisProt
  group: Databases
  url: https://disprot.org/
  api:
    url: https://disprot.org/api/DP00003
    expect: {field: acc, equals: P03265}
  enabled: true
- id: mobidb
  name: MobiDB
  group: Databases
  url: https://mobidb.org/
  repo: BioComputingUP/mobidb-ui
  api:
    url: https://mobidb.org/api/download?acc=P04637&format=json
    expect: {field: acc, equals: P04637}
  enabled: true
- id: repeatsdb
  name: RepeatsDB
  group: Databases
  url: https://repeatsdb.org/
  api:
    url: https://repeatsdb.org/api/production/annotations?skip=0&limit=1
    expect: {field: count, min: 1}
  enabled: true
- id: ped
  name: PED
  group: Databases
  url: https://proteinensemble.org/
  repo: BioComputingUP/ped5-ui
  api:
    url: https://deposition.proteinensemble.org/api/entries/PED00001
    expect: {field: entry_id, equals: PED00001}
  enabled: true
- id: fuzdb
  name: FuzDB
  group: Databases
  url: https://fuzdb.org/
  api:
    url: https://fuzdb.org/api/entries?entry_id=FC00001
    expect: {field: 0.entry_id, equals: FC00001}
  enabled: true
- id: apicuron
  name: APICURON
  group: Databases
  url: https://apicuron.org/
  repo: BioComputingUP/apicuron
  api:
    url: https://apicuron.org/api/home
    expect: {field: resource_count, min: 1}
  enabled: true
- id: caid
  name: CAID
  group: Databases
  url: https://caid.idpcentral.org/
  api:
    url: https://caid.idpcentral.org/dataset-repository/api/dataset/
    expect: {min_items: 1, field: 0.name}
  enabled: true
- id: idpcentral
  name: IDPcentral
  group: Databases
  url: https://idpcentral.org/
  enabled: true
- id: phytotypedb
  name: PhytotypeDB
  group: Databases
  url: http://phytotypedb.bio.unipd.it/
  enabled: true
- id: vhldb
  name: VHLdb
  group: Databases
  url: https://vhldb.org/
  enabled: true

