name: monitor-tests

on:
  push:
    branches: [main]
    paths: ["monitor/**", ".github/workflows/monitor-*.yml"]
  pull_request:
    paths: ["monitor/**", ".github/workflows/monitor-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: monitor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            monitor/requirements.txt
            monitor/requirements-dev.txt
      - run: pip install -r monitor/requirements.txt -r monitor/requirements-dev.txt
      - run: python -m pytest monitor/tests -q
